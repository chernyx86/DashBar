name: DashBar regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils fonts-dejavu-core
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Python, browser and queue tests
        run: |
          tesseract --list-langs --tessdata-dir ocr-models
          python -m unittest discover -s tests -v
          python tests/queue_stress.py
          node tests/workflows.cjs
          python tools/build_standalone.py DashBar-offline-ru.html
          DASHBAR_STANDALONE=DashBar-offline-ru.html node tests/workflows.cjs
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DashBar-offline
          path: DashBar-offline-ru.html
